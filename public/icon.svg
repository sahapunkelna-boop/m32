<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b24" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="fader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Chassis background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#272e3f" stroke-width="6" />

  <!-- Carbon Fiber Accent Strips -->
  <path d="M 60 140 L 452 140" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.8" />

  <!-- 3 Fader Tracks -->
  <rect x="120" y="170" width="16" height="230" rx="8" fill="#040507" stroke="#1f2533" stroke-width="3" />
  <rect x="248" y="170" width="16" height="230" rx="8" fill="#040507" stroke="#1f2533" stroke-width="3" />
  <rect x="376" y="170" width="16" height="230" rx="8" fill="#040507" stroke="#1f2533" stroke-width="3" />

  <!-- Fader Caps -->
  <rect x="98" y="270" width="60" height="42" rx="6" fill="url(#fader)" stroke="#090d16" stroke-width="3" />
  <rect x="104" y="289" width="48" height="4" fill="#ef4444" />

  <rect x="226" y="210" width="60" height="42" rx="6" fill="url(#fader)" stroke="#090d16" stroke-width="3" />
  <rect x="232" y="229" width="48" height="4" fill="#3b82f6" />

  <rect x="354" y="250" width="60" height="42" rx="6" fill="url(#fader)" stroke="#090d16" stroke-width="3" />
  <rect x="360" y="269" width="48" height="4" fill="#10b981" />

  <!-- Text Logo -->
  <text x="256" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">
    MIDAS <tspan fill="url(#gold)">M32</tspan>
  </text>
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#94a3b8" letter-spacing="6">
    iPad REMOTE
  </text>
</svg>
